<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerical Root Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        primary: {
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #404040; }
        
        /* Table responsive shadow */
        .table-container {
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="bg-black text-neutral-300 font-sans h-screen flex flex-col md:flex-row overflow-hidden selection:bg-primary-500 selection:text-white">

    <aside class="w-full md:w-80 bg-neutral-950 border-r border-neutral-800 flex flex-col h-auto md:h-full flex-shrink-0 z-10 shadow-xl overflow-y-auto">
        <div class="p-6 border-b border-neutral-800">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary-400"><path d="M12 2v20"/><path d="M2 12h20"/><path d="m4.93 4.93 14.14 14.14"/><path d="m19.07 4.93-14.14 14.14"/></svg>
                Root Finder
            </h1>
            <p class="text-xs text-neutral-500 mt-1">Numerical Methods Toolkit</p>
        </div>

        <div class="p-6 flex-grow flex flex-col gap-6">
            <!-- Function Input -->
            <div class="space-y-2">
                <label class="block text-sm font-medium text-neutral-400">Function f(x)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500 font-mono text-sm">f(x) =</span>
                    <input type="text" id="funcInput" value="x^3 - x - 2" class="w-full bg-black border border-neutral-800 rounded-lg py-2 pl-16 pr-3 text-white font-mono text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all" placeholder="e.g., x^3 - x - 2">
                </div>
                <p id="funcError" class="text-red-400 text-xs hidden mt-1">Invalid mathematical expression.</p>
            </div>

            <!-- Settings -->
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-neutral-400">Tolerance</label>
                    <input type="number" id="tolInput" value="0.000001" step="0.000001" class="w-full bg-black border border-neutral-800 rounded-lg py-2 px-3 text-white font-mono text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all">
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-neutral-400">Max Iterations</label>
                    <input type="number" id="maxIterInput" value="50" class="w-full bg-black border border-neutral-800 rounded-lg py-2 px-3 text-white font-mono text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all">
                </div>
            </div>

            <!-- Method Selection -->
            <div class="space-y-2">
                <label class="block text-sm font-medium text-neutral-400">Method</label>
                <select id="methodSelect" class="w-full bg-black border border-neutral-800 rounded-lg py-2 px-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all appearance-none cursor-pointer">
                    <option value="newton">Newton-Raphson</option>
                    <option value="bisection">Bisection</option>
                    <option value="regula">Regula Falsi</option>
                    <option value="secant">Secant</option>
                </select>
            </div>

            <!-- Dynamic Inputs -->
            <div id="dynamicInputs" class="space-y-4 pt-2 border-t border-neutral-800">
                <!-- Injected via JS based on method -->
            </div>

            <!-- Action Button -->
            <button id="calcBtn" class="w-full bg-primary-600 hover:bg-primary-500 text-white font-medium py-2.5 rounded-lg transition-colors shadow-[0_0_15px_rgba(37,99,235,0.3)] mt-auto flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                Calculate Root
            </button>
        </div>
    </aside>

    <main class="flex-grow flex flex-col h-full overflow-hidden bg-black relative">
        <!-- Overlay for empty state -->
        <div id="emptyState" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-black bg-opacity-90 backdrop-blur-sm transition-opacity duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="text-neutral-600 mb-4"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <h2 class="text-xl font-medium text-neutral-300">Awaiting Computation</h2>
            <p class="text-neutral-500 mt-2 max-w-sm text-center">Configure the parameters in the sidebar and click calculate to visualize the root finding process.</p>
        </div>

        <div class="p-6 md:p-8 flex-grow overflow-y-auto flex flex-col gap-6">
            
            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-neutral-950 p-4 rounded-xl border border-neutral-800 flex flex-col justify-center">
                    <span class="text-xs text-neutral-500 uppercase tracking-wider font-semibold">Status</span>
                    <div id="resStatus" class="text-lg font-medium mt-1 flex items-center gap-2">-</div>
                </div>
                <div class="bg-neutral-950 p-4 rounded-xl border border-neutral-800 flex flex-col justify-center lg:col-span-2">
                    <span class="text-xs text-neutral-500 uppercase tracking-wider font-semibold">Found Root (x)</span>
                    <div id="resRoot" class="text-2xl font-mono font-bold text-white mt-1">-</div>
                </div>
                <div class="bg-neutral-950 p-4 rounded-xl border border-neutral-800 flex flex-col justify-center">
                    <span class="text-xs text-neutral-500 uppercase tracking-wider font-semibold">Iterations</span>
                    <div id="resIter" class="text-lg font-mono text-white mt-1">-</div>
                </div>
            </div>

            <!-- Visualization Area -->
            <div class="bg-neutral-950 border border-neutral-800 rounded-xl p-4 h-[300px] md:h-[400px] flex-shrink-0 relative">
                <h3 class="absolute top-4 left-6 text-sm font-medium text-neutral-400 z-10">Function Plot f(x)</h3>
                <canvas id="plotCanvas" class="w-full h-full"></canvas>
            </div>

            <!-- Data Table -->
            <div class="bg-neutral-950 border border-neutral-800 rounded-xl flex flex-col flex-grow min-h-[300px] overflow-hidden">
                <div class="px-6 py-4 border-b border-neutral-800 flex justify-between items-center bg-neutral-950 z-10">
                    <h3 class="text-sm font-medium text-neutral-400">Iteration History</h3>
                </div>
                <div class="overflow-x-auto flex-grow relative table-container bg-black">
                    <table class="w-full text-left border-collapse" id="iterationTable">
                        <thead class="sticky top-0 bg-black text-neutral-400 text-xs uppercase font-semibold tracking-wider z-10 border-b border-neutral-800">
                            <tr id="tableHeader">
                                <!-- Dynamic headers -->
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="text-sm font-mono text-neutral-300 divide-y divide-neutral-800/50">
                            <!-- Dynamic rows -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // UI Elements
        const funcInput = document.getElementById('funcInput');
        const funcError = document.getElementById('funcError');
        const tolInput = document.getElementById('tolInput');
        const maxIterInput = document.getElementById('maxIterInput');
        const methodSelect = document.getElementById('methodSelect');
        const dynamicInputs = document.getElementById('dynamicInputs');
        const calcBtn = document.getElementById('calcBtn');
        const emptyState = document.getElementById('emptyState');
        
        // Result Elements
        const resStatus = document.getElementById('resStatus');
        const resRoot = document.getElementById('resRoot');
        const resIter = document.getElementById('resIter');
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');

        let chartInstance = null;
        let compiledFunc = null;

        // Number formatter
        const fmt = (num) => {
            if (num === null || num === undefined || isNaN(num)) return '-';
            // Show scientific notation if very small, else fixed
            if (Math.abs(num) > 0 && Math.abs(num) < 1e-4) return num.toExponential(6);
            return num.toFixed(6);
        };

        // UI Updates for Dynamic Inputs based on Method
        function updateDynamicInputs() {
            const method = methodSelect.value;
            dynamicInputs.innerHTML = '';
            
            if (method === 'bisection' || method === 'regula') {
                dynamicInputs.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="block text-xs text-neutral-400">Lower Bound (a)</label>
                            <input type="number" id="inputA" value="-5" class="w-full bg-black border border-neutral-800 rounded-md py-1.5 px-2 text-white font-mono text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-xs text-neutral-400">Upper Bound (b)</label>
                            <input type="number" id="inputB" value="5" class="w-full bg-black border border-neutral-800 rounded-md py-1.5 px-2 text-white font-mono text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                        </div>
                    </div>
                `;
            } else if (method === 'newton') {
                dynamicInputs.innerHTML = `
                    <div class="space-y-2">
                        <label class="block text-xs text-neutral-400">Initial Guess (x₀)</label>
                        <input type="number" id="inputX0" value="3" class="w-full bg-black border border-neutral-800 rounded-md py-1.5 px-2 text-white font-mono text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                    </div>
                `;
            } else if (method === 'secant') {
                dynamicInputs.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="block text-xs text-neutral-400">Guess 1 (x₀)</label>
                            <input type="number" id="inputX0" value="2" class="w-full bg-black border border-neutral-800 rounded-md py-1.5 px-2 text-white font-mono text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-xs text-neutral-400">Guess 2 (x₁)</label>
                            <input type="number" id="inputX1" value="3" class="w-full bg-black border border-neutral-800 rounded-md py-1.5 px-2 text-white font-mono text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                        </div>
                    </div>
                `;
            }
        }

        methodSelect.addEventListener('change', updateDynamicInputs);
        updateDynamicInputs(); // Initial call

        function compileMath() {
            try {
                // Pre-process common syntax habits (e.g., lowercase e -> E for math.js if needed, but math.js handles `e` usually)
                let expr = funcInput.value;
                compiledFunc = math.compile(expr);
                
                // Test evaluation
                compiledFunc.evaluate({ x: 0 });
                
                funcInput.classList.remove('border-red-500', 'focus:ring-red-500');
                funcInput.classList.add('border-neutral-800', 'focus:ring-primary-500');
                funcError.classList.add('hidden');
                return true;
            } catch (err) {
                funcInput.classList.remove('border-neutral-800', 'focus:ring-primary-500');
                funcInput.classList.add('border-red-500', 'focus:ring-red-500');
                funcError.classList.remove('hidden');
                return false;
            }
        }

        function f(x) {
            return compiledFunc.evaluate({ x: x });
        }

        function df(x) {
            // Numerical derivative mirroring C++ implementation
            const h = 1e-6 * Math.max(1.0, Math.abs(x));
            return (f(x + h) - f(x - h)) / (2 * h);
        }

        function bracketingMethod(isRegulaFalsi, a, b, tol, maxIter) {
            let fa = f(a), fb = f(b);
            let result = { root: null, history: [], converged: false, msg: "" };

            if (isNaN(fa) || isNaN(fb)) {
                result.msg = "f(a) or f(b) is undefined.";
                return result;
            }
            if (fa * fb > 0) {
                result.msg = "f(a) and f(b) have same signs. Root not guaranteed in [a, b].";
                return result;
            }

            let c = a, cOld = a;
            for (let i = 1; i <= maxIter; i++) {
                if (isRegulaFalsi) {
                    if (fb - fa === 0) { result.msg = "Division by zero."; break; }
                    c = (a * fb - b * fa) / (fb - fa);
                } else {
                    c = (a + b) / 2.0;
                }

                let fc = f(c);
                let err = Math.abs(c - cOld);
                
                // First iter error is conceptually N/A, using '-' in UI, but keep raw here
                result.history.push({ i, a, b, c, fa, fb, fc, err: i === 1 ? null : err });

                if (Math.abs(fc) < tol || (i > 1 && err < tol)) {
                    result.converged = true;
                    result.root = c;
                    result.msg = "Success";
                    break;
                }

                if (fa * fc < 0) {
                    b = c; fb = fc;
                } else {
                    a = c; fa = fc;
                }
                cOld = c;
            }
            
            if (!result.converged && result.history.length === maxIter) {
                result.root = c;
                result.msg = `Failed to converge after ${maxIter} iterations.`;
            }
            return result;
        }

        function newtonMethod(x0, tol, maxIter) {
            let x = x0;
            let result = { root: null, history: [], converged: false, msg: "" };

            for (let i = 1; i <= maxIter; i++) {
                let fxv = f(x);
                let d = df(x);

                if (Math.abs(d) < 1e-12 || isNaN(d)) {
                    result.msg = `Derivative near zero at x = ${fmt(x)}.`;
                    break;
                }

                let xn = x - fxv / d;
                let err = Math.abs(xn - x);

                result.history.push({ i, x_i: x, f_x_i: fxv, df_x_i: d, x_i_plus_1: xn, err });

                x = xn;
                if (isNaN(x) || !isFinite(x)) {
                    result.msg = "Iteration diverged.";
                    break;
                }

                if (err < tol || Math.abs(f(x)) < tol) {
                    result.converged = true;
                    result.root = x;
                    result.msg = "Success";
                    break;
                }
            }
            
            if (!result.converged && result.history.length === maxIter && !result.msg) {
                result.root = x;
                result.msg = `Failed to converge after ${maxIter} iterations.`;
            }
            return result;
        }

        function secantMethod(x0, x1, tol, maxIter) {
            let result = { root: null, history: [], converged: false, msg: "" };
            let xn = x1;

            for (let i = 1; i <= maxIter; i++) {
                let f0 = f(x0);
                let f1 = f(x1);

                if (Math.abs(f1 - f0) < 1e-14) {
                    result.msg = `f(x_i) - f(x_{i-1}) near zero.`;
                    break;
                }

                xn = x1 - f1 * (x1 - x0) / (f1 - f0);
                let err = Math.abs(xn - x1);

                result.history.push({ i, x_i_minus_1: x0, x_i: x1, f_x_i_minus_1: f0, f_x_i: f1, x_i_plus_1: xn, err });

                if (isNaN(xn) || !isFinite(xn)) {
                    result.msg = "Iteration diverged.";
                    break;
                }

                if (err < tol || Math.abs(f(xn)) < tol) {
                    result.converged = true;
                    result.root = xn;
                    result.msg = "Success";
                    break;
                }

                x0 = x1;
                x1 = xn;
            }

            if (!result.converged && result.history.length === maxIter && !result.msg) {
                result.root = xn;
                result.msg = `Failed to converge after ${maxIter} iterations.`;
            }
            return result;
        }

        function renderTable(method, history) {
            tableHeader.innerHTML = '';
            tableBody.innerHTML = '';

            if (history.length === 0) return;

            // Define headers based on method
            let headers = [];
            let rowRenderer;

            if (method === 'bisection' || method === 'regula') {
                headers = ['i', 'a', 'b', 'c', 'f(a)', 'f(b)', 'f(c)', 'Error'];
                rowRenderer = (r) => `
                    <td class="px-6 py-3 border-r border-neutral-800/50 text-neutral-500">${r.i}</td>
                    <td class="px-6 py-3">${fmt(r.a)}</td>
                    <td class="px-6 py-3">${fmt(r.b)}</td>
                    <td class="px-6 py-3 font-semibold text-white">${fmt(r.c)}</td>
                    <td class="px-6 py-3">${fmt(r.fa)}</td>
                    <td class="px-6 py-3">${fmt(r.fb)}</td>
                    <td class="px-6 py-3">${fmt(r.fc)}</td>
                    <td class="px-6 py-3 text-primary-400">${r.err === null ? '-' : fmt(r.err)}</td>
                `;
            } else if (method === 'newton') {
                headers = ['i', 'x_i', 'f(x_i)', "f'(x_i)", 'x_{i+1}', 'Error'];
                rowRenderer = (r) => `
                    <td class="px-6 py-3 border-r border-neutral-800/50 text-neutral-500">${r.i}</td>
                    <td class="px-6 py-3">${fmt(r.x_i)}</td>
                    <td class="px-6 py-3">${fmt(r.f_x_i)}</td>
                    <td class="px-6 py-3">${fmt(r.df_x_i)}</td>
                    <td class="px-6 py-3 font-semibold text-white">${fmt(r.x_i_plus_1)}</td>
                    <td class="px-6 py-3 text-primary-400">${r.err === null ? '-' : fmt(r.err)}</td>
                `;
            } else if (method === 'secant') {
                headers = ['i', 'x_{i-1}', 'x_i', 'f(x_{i-1})', 'f(x_i)', 'x_{i+1}', 'Error'];
                rowRenderer = (r) => `
                    <td class="px-6 py-3 border-r border-neutral-800/50 text-neutral-500">${r.i}</td>
                    <td class="px-6 py-3">${fmt(r.x_i_minus_1)}</td>
                    <td class="px-6 py-3">${fmt(r.x_i)}</td>
                    <td class="px-6 py-3">${fmt(r.f_x_i_minus_1)}</td>
                    <td class="px-6 py-3">${fmt(r.f_x_i)}</td>
                    <td class="px-6 py-3 font-semibold text-white">${fmt(r.x_i_plus_1)}</td>
                    <td class="px-6 py-3 text-primary-400">${r.err === null ? '-' : fmt(r.err)}</td>
                `;
            }

            // Build Header HTML
            headers.forEach(h => {
                const th = document.createElement('th');
                th.className = 'px-6 py-3 text-left border-r border-neutral-800/50 last:border-0';
                th.innerHTML = h.replace(/_\{(.+?)\}/g, '<sub>$1</sub>').replace(/_(.+?)/g, '<sub>$1</sub>'); // Basic subscript formatting
                tableHeader.appendChild(th);
            });

            // Build Rows
            history.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-neutral-900/50 transition-colors group';
                tr.innerHTML = rowRenderer(row);
                tableBody.appendChild(tr);
            });
        }

        function renderChart(root, startX, endX) {
            const ctx = document.getElementById('plotCanvas').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            // Determine plot range
            let span = 5;
            if (root !== null && isFinite(root)) {
                // Determine span based on inputs if possible, otherwise fixed span around root
                let min = Math.min(root, startX !== null ? startX : root);
                let max = Math.max(root, endX !== null ? endX : root);
                let range = Math.max(Math.abs(max - min), 1);
                span = range * 1.5; 
            }
            
            let center = (root !== null && isFinite(root)) ? root : 0;
            let xMin = center - span;
            let xMax = center + span;

            // Generate points
            const points = 100;
            const step = (xMax - xMin) / points;
            const dataPts = [];
            const labels = [];
            
            for (let x = xMin; x <= xMax; x += step) {
                let y = NaN;
                try { y = f(x); } catch(e){}
                
                // Limit massive y values for better visualization
                if(Math.abs(y) > 1e6) y = y > 0 ? 1e6 : -1e6;

                labels.push(x.toFixed(2));
                dataPts.push({ x: x, y: y });
            }

            // Datasets
            const datasets = [{
                label: 'f(x)',
                data: dataPts,
                borderColor: '#3b82f6', // primary-500
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.1,
                fill: false,
            }];

            if (root !== null && isFinite(root)) {
                let yRoot = f(root);
                datasets.push({
                    label: 'Found Root',
                    data: [{ x: root, y: isFinite(yRoot) ? yRoot : 0 }],
                    backgroundColor: '#10b981', // emerald-500
                    borderColor: '#000', // pure black to contrast against background
                    borderWidth: 2,
                    pointRadius: 6,
                    pointHoverRadius: 8,
                    type: 'scatter'
                });
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 500 },
                    interaction: { mode: 'nearest', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#a3a3a3' } },
                        tooltip: {
                            backgroundColor: '#000000',
                            titleColor: '#f5f5f5',
                            bodyColor: '#d4d4d4',
                            borderColor: '#262626',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            grid: { color: '#171717', tickColor: 'transparent' },
                            ticks: { color: '#a3a3a3', font: { family: 'JetBrains Mono' } },
                            border: { color: '#262626' }
                        },
                        y: {
                            grid: { color: '#171717', zeroLineColor: '#404040' },
                            ticks: { color: '#a3a3a3', font: { family: 'JetBrains Mono' } },
                            border: { color: '#262626' }
                        }
                    }
                }
            });
        }

        calcBtn.addEventListener('click', () => {
            if (!compileMath()) return;

            const method = methodSelect.value;
            const tol = parseFloat(tolInput.value);
            const maxIter = parseInt(maxIterInput.value);
            
            let result;
            let startX = null;
            let endX = null;

            try {
                if (method === 'bisection' || method === 'regula') {
                    const a = parseFloat(document.getElementById('inputA').value);
                    const b = parseFloat(document.getElementById('inputB').value);
                    startX = a; endX = b;
                    result = bracketingMethod(method === 'regula', a, b, tol, maxIter);
                } else if (method === 'newton') {
                    const x0 = parseFloat(document.getElementById('inputX0').value);
                    startX = x0; endX = x0;
                    result = newtonMethod(x0, tol, maxIter);
                } else if (method === 'secant') {
                    const x0 = parseFloat(document.getElementById('inputX0').value);
                    const x1 = parseFloat(document.getElementById('inputX1').value);
                    startX = Math.min(x0, x1); endX = Math.max(x0, x1);
                    result = secantMethod(x0, x1, tol, maxIter);
                }
            } catch (err) {
                result = { root: null, history: [], converged: false, msg: "Computation error: " + err.message };
            }

            // Hide empty state
            emptyState.classList.add('opacity-0', 'pointer-events-none');

            // Update Status Card
            if (result.converged) {
                resStatus.innerHTML = `<span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span> <span class="text-emerald-400">Converged</span>`;
            } else {
                resStatus.innerHTML = `<span class="w-3 h-3 rounded-full bg-amber-500"></span> <span class="text-amber-400">Failed / Diverged</span>`;
            }

            // Update Root Card
            if (result.root !== null && isFinite(result.root)) {
                resRoot.textContent = result.root.toFixed(8);
                resRoot.classList.remove('text-red-400');
                if(!result.converged) resRoot.classList.add('text-amber-400'); // Partial result
            } else {
                resRoot.textContent = "N/A";
                resRoot.classList.add('text-red-400');
            }
            
            if (result.msg && !result.converged) {
                 resRoot.innerHTML += `<div class="text-xs text-amber-500 font-sans font-normal mt-2 bg-amber-500/10 p-2 rounded">${result.msg}</div>`;
            }

            // Update Iterations
            resIter.textContent = result.history.length;

            // Render output
            renderTable(method, result.history);
            renderChart(result.root, startX, endX);
        });

        // Initialize math parser silently on load to prime it
        compileMath();
        
        // Add enter key listener to inputs to trigger calc
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                calcBtn.click();
            }
        });

    </script>
</body>
</html>
